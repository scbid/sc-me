<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saddle Creek Neighbors</title>
  <meta name="description" content="A community coalition for Saddle Creek.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      color: #1A1F1C;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #F0F6F2;
      background-image: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 18px,
        rgba(30, 122, 82, 0.07) 18px,
        rgba(30, 122, 82, 0.07) 19px
      );
    }
    .wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      text-align: center;
    }
    .card {
      background: #F0F6F2;
      border: 1px solid #C8DDD3;
      border-radius: 6px;
      padding: 52px 48px 48px;
      max-width: 420px;
      width: 100%;
    }
    .mark {
      font-size: 26px;
      margin-bottom: 22px;
      color: #1E7A52;
    }
    .name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.4rem, 3.5vw, 2rem);
      font-weight: 700;
      color: #134D32;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }
    .sub {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #607068;
      margin-bottom: 24px;
    }
    .rule {
      width: 40px;
      height: 1.5px;
      background: #C8DDD3;
      margin: 0 auto 24px;
    }
    .body {
      font-size: 15px;
      line-height: 1.75;
      color: #3D4D45;
      margin-bottom: 32px;
    }
    .links {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 9px 20px;
      border-radius: 4px;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-primary {
      background: #1E7A52;
      color: #fff;
      border: 1.5px solid #1E7A52;
    }
    .btn-primary:hover { background: #134D32; border-color: #134D32; }
    .btn-outline {
      background: transparent;
      color: #1E7A52;
      border: 1.5px solid #C8DDD3;
    }
    .btn-outline:hover { border-color: #1E7A52; }
    footer {
      text-align: center;
      padding: 20px;
      font-family: Helvetica, Arial, sans-serif;
      font-size: 11px;
      color: #607068;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <div class="mark">⬡</div>
      <div class="name">Saddle Creek Neighbors</div>
      <div class="sub">Saddle Creek &middot; Omaha</div>
      <div class="rule"></div>
      <p class="body">This site is being updated. Reach us directly in the meantime.</p>
      <div class="links">
        <a href="https://drive.google.com/drive/folders/1y6J7BgRbqjNSq1TGpLfYI2tDJngiW1Zl?usp=share_link" class="btn btn-primary" target="_blank" rel="noopener">Members area</a>
        <a href="mailto:saddlecreekbid@gmail.com" class="btn btn-outline">Contact us</a>
      </div>
    </div>
  </div>

  <footer>&copy; <span id="yr"></span> Saddle Creek Neighbors</footer>
  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>

</body>
</html>
