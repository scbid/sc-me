<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <title>Saddle Creek — Seven local family-run businesses are being erased (light)</title>
  <defs>
    <pattern id="dl" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="1.5" fill="rgba(30,122,82,0.10)"/>
    </pattern>
  </defs>
  <rect width="1080" height="1080" fill="#EEF6F1"/>
  <rect width="1080" height="1080" fill="url(#dl)"/>
  <rect x="80" y="80" width="920" height="3" fill="#1E7A52"/>
  <text x="80" y="148" font-family="Georgia,serif" font-size="26" font-style="italic" fill="#1E7A52">Saddle Creek Merchants United</text>
  <text x="80" y="265" font-family="Georgia,serif" font-size="108" font-weight="700" fill="#1A1F1C" letter-spacing="-2">Seven local</text>
  <text x="80" y="375" font-family="Georgia,serif" font-size="108" font-weight="700" fill="#1A1F1C" letter-spacing="-2">family-run</text>
  <text x="80" y="485" font-family="Georgia,serif" font-size="108" font-weight="700" fill="#1E7A52" font-style="italic" letter-spacing="-2">businesses</text>
  <text x="80" y="570" font-family="Georgia,serif" font-size="72" font-weight="700" fill="#1A1F1C" letter-spacing="-1">are being erased.</text>
  <rect x="80" y="602" width="920" height="1.5" fill="#C8DDD3"/>
  <text x="80" y="652" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#3D4D45">Many are immigrant-owned. All serve our</text>
  <text x="80" y="698" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#3D4D45">neighborhood. A developer wants $21M in</text>
  <text x="80" y="744" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#3D4D45">public subsidies to demolish them for luxury</text>
  <text x="80" y="790" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#3D4D45">apartments. No affordable housing. No</text>
  <text x="80" y="836" font-family="Arial,Helvetica,sans-serif" font-size="36" fill="#3D4D45">community input. Final hearing: <tspan fill="#1A1F1C" font-weight="700">June 2.</tspan></text>
  <rect x="80" y="868" width="920" height="1.5" fill="#C8DDD3"/>
  <rect x="80" y="890" width="920" height="110" fill="#134D32"/>
  <text x="540" y="936" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#ffffff">Email city council. Sign the petition.</text>
  <text x="540" y="978" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="rgba(255,255,255,0.85)">saddlecreekneighbors.org</text>
  <rect x="80" y="1000" width="920" height="3" fill="#1E7A52"/>
</svg>
